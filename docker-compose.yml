# Fleet backend — Docker Compose
#
# Scaffold only for now. Services will be filled in as each piece
# lands: broker (Mosquitto) -> robots (mock publishers) -> backend (FastAPI).
version: "3.9"

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: peppermint-broker
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  robot-r1:
    build: ./robots
    environment:
      - ROBOT_ID=r1
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - EVENTS_FILE=/data/events.jsonl
      - SPEED_MULTIPLIER=10
    volumes:
      - ./data:/data:ro
    depends_on:
      - broker
    restart: "no"

