# Fleet backend — Docker Compose
#
# broker (Mosquitto) -> robots (mock publishers) -> backend (FastAPI)
version: "3.9"

services:
  broker:
    image: eclipse-mosquitto:2
    container_name: peppermint-broker
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    healthcheck:
      # mosquitto_pub is bundled in the image; if it can connect and
      # publish, the broker is genuinely ready to accept connections
      # -- not just "the process started".
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    container_name: peppermint-backend
    ports:
      - "8001:8000"
    environment:
      - MQTT_HOST=broker
      - MQTT_PORT=1883
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  robot-r1:
    build: ./robots
    environment:
      - ROBOT_ID=r1
      - MQTT_HOST=broker
      - MQTT_PORT=1883
      - EVENTS_FILE=/data/events.jsonl
      - SPEED_MULTIPLIER=10
    volumes:
      - ./data:/data:ro
    depends_on:
      broker:
        condition: service_healthy
    restart: "no"

  robot-r2:
